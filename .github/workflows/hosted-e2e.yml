name: Hosted Staging E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-e2e-staging
  cancel-in-progress: false

jobs:
  hosted-e2e:
    name: hosted E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_USER_OWNER_USERNAME: ${{ secrets.E2E_USER_OWNER_USERNAME }}
      E2E_USER_OWNER_PASSWORD: ${{ secrets.E2E_USER_OWNER_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx e2e-web install chromium --with-deps

      - name: Run hosted staging E2E
        run: npm run test:e2e:hosted

      - name: Preserve hosted E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-staging-e2e-report
          path: .e2e
          if-no-files-found: ignore
          retention-days: 7

name: Phase 1 non-production backups

on:
  push:
    branches:
      - codex/phase1-backup-staging-test-main
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Non-production backup target
        required: true
        type: choice
        options:
          - development
          - staging

permissions:
  contents: read

concurrency:
  group: phase1-backup-nonproduction
  cancel-in-progress: false

jobs:
  sentry-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci
      - name: Configure and verify development Sentry backup alert
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'development') }}
        run: node scripts/cloudflare/sentry-backup-alert-setup.mjs development
      - name: Configure and verify staging Sentry backup alert
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase1-backup-staging-test-main') }}
        run: node scripts/cloudflare/sentry-backup-alert-setup.mjs staging

  development:
    needs: sentry-setup
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'development') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The confirmed DEV S3 pair is stored in this protected Environment. Its
    # required-reviewer rule remains in force for scheduled and manual runs.
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ID_DEV }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_DEV }}
      AWS_DEFAULT_REGION: auto
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_CRON_MONITOR_SLUG: nextap-phase1-development-backup
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci
      - run: npm install --global wrangler@4.161.0
      - name: Generate verified development recovery point
        run: node scripts/cloudflare/phase1-scheduled-backup.mjs development

  staging:
    needs: sentry-setup
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase1-backup-staging-test-main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ID_DEV }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_DEV }}
      AWS_DEFAULT_REGION: auto
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_CRON_MONITOR_SLUG: nextap-phase1-staging-backup
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci
      - run: npm install --global wrangler@4.161.0
      - name: Generate verified staging recovery point
        run: node scripts/cloudflare/phase1-scheduled-backup.mjs staging

name: Phase 1 non-production backups

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Non-production backup target
        required: true
        type: choice
        options:
          - development
          - staging

permissions:
  contents: read

concurrency:
  group: phase1-backup-nonproduction
  cancel-in-progress: false

jobs:
  development:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The confirmed DEV S3 pair is stored in this protected Environment. Its
    # required-reviewer rule remains in force for scheduled and manual runs.
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ID_DEV }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_DEV }}
      AWS_DEFAULT_REGION: auto
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci
      - run: npm install --global wrangler@4.161.0
      - name: Generate verified development recovery point
        run: node scripts/cloudflare/phase1-scheduled-backup.mjs development

  staging:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ID_DEV }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_DEV }}
      AWS_DEFAULT_REGION: auto
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci
      - run: npm install --global wrangler@4.161.0
      - name: Generate verified staging recovery point
        run: node scripts/cloudflare/phase1-scheduled-backup.mjs staging

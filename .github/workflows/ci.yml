name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTAP_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://preview.example.invalid
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation registrations
        run: npm run check:docs

      - name: Validate story-to-E2E coverage metadata
        run: npm run check:stories

      - name: Check documented module boundaries
        run: npm run check:architecture

      - name: Check source file budgets
        run: npm run check:file-budget

      - name: Check dependency changes and audit the full tree
        run: npm run check:dependencies -- --require-audit

      - name: Runtime dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Verify committed dependency manifests
        run: git diff --exit-code -- package.json package-lock.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx e2e-web install chromium --with-deps

      - name: Public desktop and mobile smoke tests
        run: npx e2e run tests/e2e/public-journey.e2e.ts tests/e2e/quick-actions-layout.e2e.ts --output artifacts/ci-smoke
        env:
          E2E_SERVER_MODE: production

      - name: Preserve browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke-report
          path: artifacts/ci-smoke
          if-no-files-found: ignore
          retention-days: 7

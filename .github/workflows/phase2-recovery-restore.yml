name: Phase 2 staging recovery restore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-staging-recovery-restore
  cancel-in-progress: false

jobs:
  restore-staging-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MIGRATION_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ID_DEV }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_DEV }}
      AWS_DEFAULT_REGION: auto
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci
      - run: npm install --global wrangler@4.161.0
      - name: Restore the pinned staging generation to a disposable D1
        run: node scripts/cloudflare/phase2-recovery-restore-rehearsal.mjs

name = "nextap-phase1-runtime"
main = "../../workers/phase1-foundation/src/index.ts"
compatibility_date = "2026-11-13"
workers_dev = false

[env.development]
name = "nextap-phase1-runtime-development"
workers_dev = false

[env.development.vars]
APP_ENV = "development"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[env.development.d1_databases]]
binding = "NEXTAP_DB"
database_name = "nextap-dev-core"
database_id = "a64cabf6-b8f4-41aa-84fc-b7fed5d2dde7"

[[env.development.r2_buckets]]
binding = "NEXTAP_PUBLIC_MEDIA"
bucket_name = "nextap-dev-public"

[[env.development.kv_namespaces]]
binding = "NEXTAP_SLUG_CACHE"
id = "58df600b88a94da7806deb7ad5bc90c2"

[env.staging]
name = "nextap-phase1-runtime-staging"
workers_dev = false

[env.staging.vars]
APP_ENV = "staging"
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[env.staging.d1_databases]]
binding = "NEXTAP_DB"
database_name = "nextap-staging-core"
database_id = "98f7be19-5ab8-47c3-9e36-f7df99d83089"

[[env.staging.r2_buckets]]
binding = "NEXTAP_PUBLIC_MEDIA"
bucket_name = "nextap-staging-public"

[[env.staging.kv_namespaces]]
binding = "NEXTAP_SLUG_CACHE"
id = "d0154043f05a495c8e5e0ef5dbb81dc1"
